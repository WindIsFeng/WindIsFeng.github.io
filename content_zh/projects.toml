[[items]]
title = "Multi-scale Modeling of Extreme Urban Wind Conditions under Climate Change (RGC Ref. No. 11203924)"
content = """
Many coastal cities, such as Hong Kong, have high population densities and numerous buildings and are located in tropical cyclone (TC)-prone areas. Current standards and codes generally provide design wind speeds based on typical terrain categories for an entire city. However, urban wind conditions during TC events are significantly influenced by complex urban landscapes so that high-resolution estimation of the urban wind environment is desired. To date, fine-scale modeling of extreme urban wind fields remains challenging due to high computational costs and uncertainties associated with atmospheric boundary layer (ABL) conditions. Additionally, the impact of climate change on extreme urban wind conditions is not well understood and related research is limited. To this end, this proposed project will be aimed at developing a novel multi-scale modeling framework to assess the urban wind fields during TCs under various climate change scenarios.

The proposed study will integrate the advanced Weather Research and Forecasting (WRF) model with Computational Fluid Dynamics (CFD) simulations to capture complex interactions between large-scale atmospheric processes and fine-scale urban features. The WRF module will provide real ABL conditions for the CFD module. This framework will allow for detailed estimates of urban wind environments, such as the wind velocity distribution on a specific street or region and the wind effects on large-scale buildings or infrastructures.

To investigate the influence of climate change on extreme urban wind conditions, a new machine learning-based TC detection and tracking model will be developed based on historical reanalysis datasets. Subsequently, the model will be applied to find out all TC events in a multi-model ensemble consisting of multiple Global Climate Models (GCMs) with various Shared Socioeconomic Pathways (SSPs) provided by the Coupled Model Intercomparison Project Phase 6 (CMIP6). And all TC events that pose potential threats to Hong Kong will be identified and simulated using the proposed WRF-CFD framework. In addition, uncertainties throughout this modeling pipeline will be quantified and analyzed.

Finally, this research will establish a high-resolution dataset characterizing urban wind conditions for different return periods. The dataset will provide invaluable information for urban planners, engineers, and policymakers to improve the design of resilient cities and hazard managements, which are particularly relevant for Hong Kong. Additionally, the research findings will contribute to broader scientific understanding of urban meteorology and climate adaptation strategies, offering new perspectives on how cities can better address the threats of TCs and challenges posed by climate changes.
"""

[[items]]
title = "Projection of Design Wind Speeds in the Southeastern Coastal Regions of China Under Climate Change Using a Physics-Driven Tropical Cyclone Model (RGC Ref No. 11204125)"
content = """
Tropical cyclones (TCs), also known as hurricanes or typhoons, are destructive natural hazards that can result in significant impacts on coastal regions and even inland areas. Current research shows that climate change has notable influence on TC behaviors such as changes in occurrence frequency, increase in intensity, shifts in track motion, rapid intensification. It is necessary to be prepared for the potential changes in TC behaviors to mitigate risks and protect vulnerable populations. While existing TC models have been applied for predicting the behavior of these storms, they may not be entirely sufficient to address the inherent complexities and non-stationarity introduced by climate change. For example, most TC models are primarily based on historical data, including past TC tracks, intensities, and environmental forcings. Climate change is causing shifts in sea surface temperatures, atmospheric boundary layer patterns, and other factors that are governing the TC environment. As a result, the historical data used for model training and validation may be short and limited and thus insufficient to make satisfactory predictions. Moreover, the linear wind field models established on symmetric pressure models are not able to accurately represent the realistic TC events. These models also do not consider the nonlinearity of the wind field and the non-uniform surface conditions after landfalls. Therefore, the extreme wind estimations and track predictions based on these models often show large deviations from observations.

This research aims to improve the performance of the physics-driven TC models so as to provide more reliable projections of design wind speeds across southeast coastal regions of China under potential climate change. Four tasks are specified around this research topic: (1) Reconstruction of 3D TC wind field using physics-informed neural networks; (2) Investigation of TC vortex structures for improved track prediction; (3) Modeling of TC intensity evolution considering topographic effects; (4) Large regional and city-scale mappings of the design wind speed under climate change. In Task (1), comprehensive numerical simulations of TCs based on the Weather Research & Forecasting (WRF) model will be conducted. The simulations will be validated against the Global Positioning System (GPS) dropsonde measurements and the routine observations of over 50 weather stations operated by Hong Kong Observatory (HKO). The 3D wind field will be reconstructed based on the observed data and momentum equations of the air. In task (2), the asymmetries of the 3D wind field will be identified after the TCs making their landfalls and azimuth-dependent pressure models will be established. The relationship between the track motion and the winds on different pressure levels will be investigated to figure out the critical pressure levels that govern the TC tracks. Regarding track predictions, typical vortex structures will be tested with comparison of the asymmetric wind field model in the vorticity equation. In task (3), two intensity models will be proposed. One is the hybrid model that simulates the intensity over the ocean using two coupled ordinary differential equations and simulates the intensity over the land using the terrain-following numerical model. The other is the revised denoised diffusion model which provides the probabilistic spatiotemporal predictions of the intensity evolutions. In task (4), the global climate models (GCMs) will be employed to obtain the predicted environmental conditions and the TC behavior variations will be examined under climate change. Then, regional and city-scale mappings of the design wind speed will be completed considering climate variability for the reference of future wind engineering applications.
"""

[[items]]
title = "Hazard Assessment of Compound Typhoon-Induced Strong Winds and Heavy Rainfall in the Southeastern Coastal Regions of China Under Climate Change (NSFC No. 52578610)"
content = """
Typhoon-induced strong winds and heavy rainfall frequently impact the southeast coastal regions of China. The spatiotemporal characteristics of typhoons and rainfall are varying under climate change, making traditional statistical typhoon models struggle to provide reliable predictions. This project aims to develop a physics-driven full-track typhoon model using state-of-the-art deep learning techniques, addressing the compatibility challenges between typhoon modeling and climate change. Furthermore, the project will establish a three-dimensional typhoon wind field model based on physics-informed neural networks to refine the spatial reconstruction of typhoon wind fields, with particular emphasis on capturing the nonlinear and chaotic characteristics of typhoon wind fields. Additionally, the spiral rainband theory will be incorporated to address the spatial asymmetry of typhoon-induced rainfall, significantly improving the accuracy of typhoon rainfall models. The physics-driven typhoon and rainfall model will be coupled using the three-dimensional wind field model, facilitating synchronous simulation of typhoon and rainfall hazards. The integrated typhoon and rainfall model will not only be applicable for joint wind and rainfall hazard assessment but also facilitate effective future disaster predictions by integrating with global climate models. The outcomes of this project will provide scientific references for disaster prevention and mitigation efforts and offer valuable insights for future urban planning and structural design in the southeastern coastal regions of China.
"""
